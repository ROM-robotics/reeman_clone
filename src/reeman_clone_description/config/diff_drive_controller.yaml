controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    publish_rate: 50.0
    use_stamped_vel: false
    cmd_vel_timeout: 0.5
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.365  # actual: |left_y(0.1867) - right_y(-0.1787)| = 0.3654 m
    wheel_radius: 0.085

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.5
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 3.0

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 4.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 8.0
